name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ', lowest dependencies' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', symfony: '5.4.*' }
          - { php: '7.4', symfony: '5.4.*', dependencies: lowest }
          - { php: '8.0', symfony: '5.4.*' }
          - { php: '8.1', symfony: '5.4.*' }
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '5.4.*', dependencies: lowest }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '6.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.1.*' }
          - { php: '8.5', symfony: '7.4.*' }
          - { php: '8.5', symfony: '8.1.*' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex
      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
      - name: Run the tests
        run: |
          # PHPUnit 9 has no --fail-on-deprecation: it turns deprecations into errors by itself.
          args=""
          if ! vendor/bin/phpunit --version | grep -q 'PHPUnit 9\.'; then args="--fail-on-deprecation"; fi
          vendor/bin/phpunit $args

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: flex
      - run: composer update --no-interaction --no-progress
        env:
          SYMFONY_REQUIRE: 8.1.*
      - run: vendor/bin/phpstan analyse --no-progress
